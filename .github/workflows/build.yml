name: Build Geode Mod
 
on:
  workflow_dispatch:
  push:
    branches:
      - "**"
 
jobs:
  build:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
 
      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          # Solo compilamos Windows, porque mod.json solo declara "win".
          # Si sigue habiendo conflicto de versiones SDK/bindings, descomenta:
          # sdk: nightly
          build-config: Release
 
